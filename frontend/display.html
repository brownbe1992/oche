  // all players share one live inning, not independent per-player state.
  baseball: {
    /* Nine innings as cells, runs in the big slot. A blank inning is scored
       (0 runs) and a not-yet-played one is empty — different facts, so they
       never share a look. */
    lane(p, i, s, L){
      const inning = num((s.modeState||{}).baseballInning) || 1;
      const max = Math.max(9, inning);
      const cells = Array.from({length:max}, (_,k)=>{
        const r = (p.inningRuns||{})[k+1];
        if(r == null) return pendingCell(String(k+1));
        return { label: String(k+1), glyph: String(num(r)),
          state: num(r) === 9 ? 'ok' : num(r) === 0 ? 'no' : null };
      });
      if(cells[inning-1]) cells[inning-1].state = cells[inning-1].state || 'now';
      return buildModeLane(p, i, s, L, {
        sub: `inning ${Math.min(inning,max)} of ${max} · ${num(p.legDarts)} darts`,
        cells, big: num(p.totalRuns), bigUnit: 'runs',
      });
    },
    resultStats(p){ return [{ v: p.totalRuns, k: 'runs' }]; },
    scorecard(s, L){
      const players = s.players;
      const active = s.currentIndex;
      const inning = (s.modeState||{}).baseballInning || 1;
      const { lastCount: lastInning, suffix: inningSuffix } = roundOverrunInfo(inning, 9, 'innings');
      const rows = [];
      for(let i=1;i<=lastInning;i++){
        const isCurrentInning = i===inning;
        const cells = players.map((p,pi)=>{
          const r = p.inningRuns && p.inningRuns[i];
          const isActive = pi===active && isCurrentInning;
          return `<div class="cs-cell${isActive?' active':''}">${r!=null?`<span class="cs-points">${num(r)}</span>`:''}</div>`;
        }).join('');
        rows.push(`<div class="cs-row"><div class="cs-label">${i}</div>${cells}</div>`);
      }

      const headCells = buildScorecardHeadCells(players, active);
      const totalCells = buildScorecardFootCells(players, active, p=>p.totalRuns);
      const thrower = players[active];

      return `<div class="cs-wrap" style="--cs-cols:${players.length}">
        <div class="cs-table">
          <div class="cs-row cs-head"><div class="cs-label"></div>${headCells}</div>
          ${rows.join('')}
          <div class="cs-row cs-foot"><div class="cs-label">Runs</div>${totalCells}</div>
        </div>
        ${buildScorecardThrowRow(thrower?`<b>${escapeHtml(thrower.name)}</b> at the oche — Inning ${Math.min(inning,9)} of 9${inningSuffix}`:'', s.darts)}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [{ value: num(p.totalRuns), label:'Runs' }]);
    }
  },
  // Shanghai (docs/archive/shanghai-roadmap.md): same shared chalkboard-table shape as
  // Baseball's own (rows=rounds 1-config.rounds, columns=players) — all players
  // share one live round, not independent per-player state. Row labels show the
  // round's own TARGET NUMBER (not the round index) so the live board matches
  // what's actually live to score against.
  shanghai: {
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const max = num(ms.shanghaiMaxRounds) || 7;
      const round = num(ms.shanghaiRound) || 1;
      const cells = Array.from({length:Math.max(max, round)}, (_,k)=>{
        const v = (p.roundPoints||{})[k+1];
        if(v == null) return pendingCell(String(k+1));
        return { label: String(k+1), glyph: String(num(v)), state: num(v) === 0 ? 'no' : null };
      });
      if(cells[round-1]) cells[round-1].state = cells[round-1].state || 'now';
      return buildModeLane(p, i, s, L, {
        sub: `round ${Math.min(round,max)} of ${max} · ${num(p.legDarts)} darts`,
        cells, big: num(p.totalPoints), bigUnit: 'pts',
      });
    },
    resultStats(p){ return [{ v: p.totalPoints, k: 'points' }]; },
    scorecard(s, L){
      const players = s.players;
      const active = s.currentIndex;
      const maxRounds = (s.modeState||{}).shanghaiMaxRounds || 7;
      const round = (s.modeState||{}).shanghaiRound || 1;
      const { lastCount: lastRound, suffix: roundSuffix } = roundOverrunInfo(round, maxRounds, 'rounds');
      const rows = [];
      for(let i=1;i<=lastRound;i++){
        const isCurrentRound = i===round;
        const target = i<=maxRounds ? i : maxRounds;
        const cells = players.map((p,pi)=>{
          const r = p.roundPoints && p.roundPoints[i];
          const isActive = pi===active && isCurrentRound;
          return `<div class="cs-cell${isActive?' active':''}">${r!=null?`<span class="cs-points">${num(r)}</span>`:''}</div>`;
        }).join('');
        rows.push(`<div class="cs-row"><div class="cs-label">${target}</div>${cells}</div>`);
      }

      const headCells = buildScorecardHeadCells(players, active);
      const totalCells = buildScorecardFootCells(players, active, p=>p.totalPoints);
      const thrower = players[active];

      return `<div class="cs-wrap" style="--cs-cols:${players.length}">
        <div class="cs-table">
          <div class="cs-row cs-head"><div class="cs-label"></div>${headCells}</div>
          ${rows.join('')}
          <div class="cs-row cs-foot"><div class="cs-label">Points</div>${totalCells}</div>
        </div>
        ${buildScorecardThrowRow(thrower?`<b>${escapeHtml(thrower.name)}</b> at the oche — Round ${Math.min(round,maxRounds)} of ${maxRounds}${roundSuffix}`:'', s.darts)}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [{ value: num(p.totalPoints), label:'Points' }]);
    }
  },
  // Halve-It (docs/archive/halve-it-roadmap.md): same shared chalkboard-table
  // shape as Shanghai's own, with row labels showing the round's own TARGET
  // LABEL (e.g. "Double 7", "Bull") read from s.modeState.halveItTargets (the
  // full sequence, sent because this file has no shared scoring.js module to
  // derive per-round targets from) and cells showing the RUNNING TOTAL after
  // that round with a ½ marker on a halved round, mirroring index.html's own
  // renderGameHalveIt() exactly.
  halve_it: {
    /* roundTotals holds the RUNNING total after each round, so a halving shows
       up as a drop rather than a zero — which is why the halved cell is marked
       in its own right rather than left for the number to imply. */
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const targets = Array.isArray(ms.halveItTargets) ? ms.halveItTargets : [];
      const round = num(ms.halveItRound) || 1;
      const cells = Array.from({length:Math.max(targets.length, round)}, (_,k)=>{
        const t = targets[k];
        const label = t == null ? String(k+1) : halveItTargetLabel(t, true);
        const v = (p.roundTotals||{})[k+1];
        if(v == null) return pendingCell(label);
        const halved = !!(p.roundHalved||{})[k+1];
        return { label, glyph: (halved ? '½ ' : '') + num(v), state: halved ? 'no' : 'ok' };
      });
      if(cells[round-1]) cells[round-1].state = 'now';
      return buildModeLane(p, i, s, L, {
        sub: `round ${round} of ${targets.length || round}${p.everHalved ? ' · halved' : ''}`,
        cells, big: num(p.total), bigUnit: 'total',
      });
    },
    resultStats(p){ return [{ v: p.total, k: 'total' }]; },
    scorecard(s, L){
      const players = s.players;
      const active = s.currentIndex;
      const targets = ((s.modeState||{}).halveItTargets && s.modeState.halveItTargets.length) ? s.modeState.halveItTargets : [{sector:20}];
      const maxRounds = targets.length;
      const round = (s.modeState||{}).halveItRound || 1;
      const { lastCount: lastRound, suffix: roundSuffix } = roundOverrunInfo(round, maxRounds, 'rounds');
      const targetAt = i => targets[Math.min(i, maxRounds) - 1];
      const targetLabel = t => halveItTargetLabel(t);
      const rows = [];
      for(let i=1;i<=lastRound;i++){
        const isCurrentRound = i===round;
        const cells = players.map((p,pi)=>{
          const r = p.roundTotals && p.roundTotals[i];
          const halved = p.roundHalved && p.roundHalved[i];
          const isActive = pi===active && isCurrentRound;
          return `<div class="cs-cell${isActive?' active':''}">${r!=null?`<span class="cs-points">${halved?'½ ':''}${num(r)}</span>`:''}</div>`;
        }).join('');
        rows.push(`<div class="cs-row"><div class="cs-label">${escapeHtml(targetLabel(targetAt(i)))}</div>${cells}</div>`);
      }

      const headCells = buildScorecardHeadCells(players, active);
      const totalCells = buildScorecardFootCells(players, active, p=>p.total);
      const thrower = players[active];

      return `<div class="cs-wrap" style="--cs-cols:${players.length}">
        <div class="cs-table">
          <div class="cs-row cs-head"><div class="cs-label"></div>${headCells}</div>
          ${rows.join('')}
          <div class="cs-row cs-foot"><div class="cs-label">Total</div>${totalCells}</div>
        </div>
        ${buildScorecardThrowRow(thrower?`<b>${escapeHtml(thrower.name)}</b> at the oche — Round ${Math.min(round,maxRounds)} of ${maxRounds}${roundSuffix}, target ${escapeHtml(targetLabel(targetAt(round)))}`:'', s.darts)}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [{ value: num(p.total), label:'Total' }]);
    }
  },
  // The Pressure Chamber (docs/archive/pressure-chamber-roadmap.md): same shared
  // cs-table chalkboard shape as Shanghai/Halve-It's own (rows=rounds
  // 1-config.rounds, columns=players), each settled cell showing an icon for
  // that round's outcome (✅ full / ➗ partial / ❌ miss). The full 15-round
  // card sequence rides in s.modeState.pressureChamberCards (this file has no
  // shared scoring.js module to derive per-round targets from, same reasoning
  // s.modeState.halveItTargets already documents) — a big banner below the
  // table shows the CURRENT round's target/modifier/flavor text, large and
  // unmissable, plus a live No Warmup countdown read from
  // s.modeState.pressureChamberDeadline.
  pressure_chamber: {
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const cards = Array.isArray(ms.pressureChamberCards) ? ms.pressureChamberCards : [];
      const round = num(ms.pressureChamberRound) || 1;
      const ICON = { full:'✅', partial:'➗', miss:'❌' };
      const cells = Array.from({length:Math.max(cards.length, round)}, (_,k)=>{
        const r = (p.roundResults||{})[k+1];
        if(!r) return pendingCell(String(k+1));
        return { label: String(k+1), glyph: ICON[r] || '',
          state: r === 'full' ? 'ok' : r === 'miss' ? 'no' : null };
      });
      if(cells[round-1]) cells[round-1].state = cells[round-1].state || 'now';
      return buildModeLane(p, i, s, L, {
        sub: `round ${round} · ${num(p.fullHits)} full · ${num(p.misses)} missed`,
        cells, big: num(p.totalCp), bigUnit: 'cp',
      });
    },
    resultStats(p){
      return [{ v: p.totalCp, k: 'composure points' }, { v: p.rating, k: 'rating' }];
    },
    scorecard(s, L){
      const players = s.players;
      const active = s.currentIndex;
      const ms = s.modeState || {};
      const cards = Array.isArray(ms.pressureChamberCards) ? ms.pressureChamberCards : [];
      const maxRounds = cards.length || 15;
      const round = ms.pressureChamberRound || 1;
      const { lastCount: lastRound } = roundOverrunInfo(round, maxRounds, 'rounds');
      const cardAt = i => cards[Math.min(i, maxRounds) - 1];
      const OUTCOME_ICON = { full:'✅', partial:'➗', miss:'❌' };
      const rows = [];
      for(let i=1;i<=lastRound;i++){
        const isCurrentRound = i===round;
        const c = cardAt(i);
        const cells = players.map((p,pi)=>{
          const r = p.roundResults && p.roundResults[i];
          const isActive = pi===active && isCurrentRound;
          return `<div class="cs-cell${isActive?' active':''}">${r?`<span class="cs-points">${OUTCOME_ICON[r]||''}</span>`:''}</div>`;
        }).join('');
        rows.push(`<div class="cs-row"><div class="cs-label">${i}</div>${cells}</div>`);
      }

      const headCells = buildScorecardHeadCells(players, active);

      const totalCells = buildScorecardFootCells(players, active, p=>p.totalCp);
      const thrower = players[active];

      const liveCard = cardAt(round);
      const noWarmup = liveCard && liveCard.modifier && liveCard.modifier.key === 'no_warmup';
      const remainingSec = (noWarmup && ms.pressureChamberDeadline != null) ? Math.max(0, Math.ceil((ms.pressureChamberDeadline - Date.now())/1000)) : null;
      // docs/bug-roadmap.md BUG-30: the banner needs BOTH nested objects, not just a
      // truthy card — `liveCard ?` alone let a card missing `target`/`modifier` through
      // and then threw on `.label`, which (before renderSafe()) tore the whole screen.
      // Same Array.isArray()/shape-check discipline renderers.halve_it already applies
      // to its own targets list; a card that isn't fully formed simply gets no banner.
      const hasBanner = !!(liveCard && liveCard.target && liveCard.modifier);
      const banner = hasBanner ? `<div class="pc-banner">
        <div style="font-size:22px;font-weight:800">${escapeHtml(liveCard.target.label)}</div>
        <div style="font-size:16px;font-weight:700;margin-top:4px">${escapeHtml(liveCard.modifier.icon)} ${escapeHtml(liveCard.modifier.label)}</div>
        <div style="font-style:italic;font-size:13px;margin-top:2px">${escapeHtml(liveCard.modifier.flavor)}</div>
        ${remainingSec!=null?`<div style="margin-top:6px;font-size:20px;font-weight:800">${remainingSec}s</div>`:''}
      </div>` : '';

      return `<div class="cs-wrap" style="--cs-cols:${players.length}">
        <div class="cs-table">
          <div class="cs-row cs-head"><div class="cs-label"></div>${headCells}</div>
          ${rows.join('')}
          <div class="cs-row cs-foot"><div class="cs-label">CP</div>${totalCells}</div>
        </div>
        ${banner}
        ${buildScorecardThrowRow(thrower?`<b>${escapeHtml(thrower.name)}</b> at the oche — Round ${Math.min(round,maxRounds)} of ${maxRounds}`:'', s.darts)}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [
        { value: num(p.totalCp), label:'CP' },
        { value: escapeHtml(p.rating||''), label:'Rating' },
      ]);
    }
  },
  // Bob's 27 (docs/archive/practice-ladders-roadmap.md Part A): same shared
  // chalkboard-table shape as Cricket/Baseball's (rows=rounds D1-D20, one
  // column since it's always solo), just fixed at exactly 20 rows — no
  // "extra innings"-style dynamic extension the way Baseball's table needs.
  bobs_27: {
    /* Twenty doubles as cells. The running score leads, because in Bob's 27 the
       score IS the drama — it can go negative and end the run. */
    lane(p, i, s, L){
      const round = num((s.modeState||{}).bobs27Round) || 1;
      const cells = Array.from({length:20}, (_,k)=>{
        const r = (p.roundResults||{})[k+1];
        if(r == null) return pendingCell('D'+(k+1));
        return { label: 'D'+(k+1), glyph: num(r) > 0 ? '+'+num(r) : '−'+((k+1)*2),
          state: num(r) > 0 ? 'ok' : 'no' };
      });
      if(cells[round-1]) cells[round-1].state = cells[round-1].state || 'now';
      const scored = Object.keys(p.roundResults||{}).length;
      return buildModeLane(p, i, s, L, {
        sub: `D${round} of 20 · ${scored} round${scored===1?'':'s'} played`,
        cells, big: num(p.running), bigUnit: 'score',
      });
    },
    resultStats(p){ return [{ v: p.running, k: 'final score' }]; },
    scorecard(s, L){
      const p = s.players[0];
      const round = (s.modeState||{}).bobs27Round || 1;
      const rows = [];
      for(let r=1;r<=20;r++){
        const isCurrentRound = r===round;
        const result = p.roundResults && p.roundResults[r];
        const cellText = result==null ? '' : `<span class="cs-points">${result>0?'+'+num(result):'−'+num(r*2)}</span>`;
        rows.push(`<div class="cs-row"><div class="cs-label">D${r}</div><div class="cs-cell${isCurrentRound?' active':''}">${cellText}</div></div>`);
      }

      return `<div class="cs-wrap" style="--cs-cols:1">
        <div class="cs-table">
          <div class="cs-row cs-head"><div class="cs-label"></div><div class="cs-col-head active"><span>${escapeHtml(p.name)}</span><span class="cs-throw-chip">▸ throwing</span></div></div>
          ${rows.join('')}
          <div class="cs-row cs-foot"><div class="cs-label">Score</div><div class="cs-cell"><span class="cs-points active">${num(p.running)}</span></div></div>
        </div>
        ${buildScorecardThrowRow(`<b>${escapeHtml(p.name)}</b> at the oche — D${round}, running score ${num(p.running)}`, s.darts)}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [{ value: num(p.running), label:'Final Score' }]);
    }
  },
  // 121 Checkout Ladder (docs/archive/practice-ladders-roadmap.md Part B): solo drill,
  // always exactly one player/card — a genuine X01-shaped visit (double-out,
  // checkout hints, dart slots), just against a climbing/dropping target
  // instead of an opponent, so this mirrors x01's own card almost exactly —
  // swapping "Leg N" for "Target N · Attempt N" and Darts Thrown for a
  // visit-of-3 counter, since neither leg-scoped nor session-scoped darts is
  // as meaningful here as which visit of this attempt is live.
  checkout_ladder: {
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const target = num(ms.checkoutLadderTarget) || 121;
      const visits = num(ms.checkoutLadderVisits);
      const lane = (ms.lanes && ms.lanes[i]) || null;
      const stats = [
        { v: target, k: 'target' },
        { v: `${visits+1} of 3`, k: 'visit' },
        { v: num(p.legDarts), k: 'darts this rung' },
      ];
      if(lane) stats.push({ v: num(lane.bestVisit), k: 'best visit' });
      return laneHtml({
        active: i === s.currentIndex, name: p.name,
        sub: `attempt ${num(s.legNo)} · climbing from 61 to 170`,
        recent: L.showRecent && lane ? laneRecentHtml(lane.recent) : '', recentLabel: 'visits',
        stats, big: num(p.score),
      });
    },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const target = num((s.modeState||{}).checkoutLadderTarget || 121);
      const visit = Math.min(((s.modeState||{}).checkoutLadderVisits||0)+1, 3);
      let throwbox = '';
      if(active){
        const co = s.checkout
          ? `<div class="checkout"><span class="lab">Checkout</span><span class="route">${formatCheckoutRoute(s.checkout)}</span></div>`
          : '';
        throwbox = `<div class="throwbox"><div class="darts">${buildDartSlots(s.darts)}</div>${co}</div>`;
      }
      const flash = statusFlash(active, s.status, 'TARGET CLEARED');

      const meta = !L.showMeta ? '' : `<div class="meta"><span class="standing">Target ${target} · Attempt ${num(s.legNo)} · Visit ${visit}/3</span></div>`;

      return `<div class="pcard ${active?'active':''}">
        ${flash}
        <div>
          <div class="prow1">
            <span class="pname">${escapeHtml(p.name)}</span>
            ${L.showTag ? `<span class="ptag">DOUBLE OUT</span>` : ''}
            ${active?'<span class="throwflag">▸ throwing</span>':''}
          </div>
          <div class="score">${num(p.score)}</div>
        </div>
        ${meta}
        ${throwbox}
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [{ value: num(p.legDarts), label:'Darts This Attempt' }], { noWinner:true });
    }
  },
  // Killer (docs/game-modes-roadmap.md "Killer"): elimination H2H, always
  // multiple players/cards (never scorecard-layout) — one card per player showing
  // their randomly-assigned number, lives-as-pips (mirrors index.html's own
  // renderGameKiller()), killer status, and kills. s.modeState.killerLives comes
  // from liveSnapshot()'s GAME_TYPES.killer.liveModeState (index.html).
  killer: {
    strip(s, L){
      const me = s.players[s.currentIndex];
      if(!me) return null;
      const need = me.isKiller
        ? { k: `${me.name} is hunting`, r: 'any live number',
            note: 'a double on someone else\'s number takes a life' }
        : { k: `${me.name} needs`, r: 'D' + num(me.number), note: 'to become a killer' };
      return singleDartStrip(null, need);
    },
    /* The player's NUMBER is the most important fact in Killer and used to be a
       footnote chip; it leads the lane. Lives sit in the big slot, since
       survival rather than a score is the result. */
    lane(p, i, s, L){
      const lives = num(p.lives);
      const target = num((s.modeState||{}).killerLives) || 3;
      const pips = Array.from({length:target}, (_,k)=>
        ({ label:'', glyph: k < lives ? '●' : '✕', state: k < lives ? 'ok' : 'no' }));
      return laneHtml({
        active: i === s.currentIndex && !p.eliminated, out: !!p.eliminated,
        lead: `<span class="lane-big" style="margin-left:0;font-size:5.4vmin;` +
              `border:.2vmin solid var(--gold);border-radius:1.1vmin;padding:0 1.4vmin;` +
              `color:var(--gold);transform:none">${num(p.number)}</span>`,
        name: p.name,
        sub: p.eliminated ? 'out' : (p.isKiller ? 'killer — hunting everyone' : `needs D${num(p.number)} to become killer`),
        cells: laneCellsHtml(pips),
        big: p.eliminated ? 'OUT' : lives, bigUnit: p.eliminated ? '' : (lives === 1 ? 'life' : 'lives'),
        bigSmall: !!p.eliminated,
      });
    },
    resultStats(p){
      return [{ v: p.kills, k: 'kills' }, { v: 'D' + num(p.number), k: 'their number' }];
    },
    card(p, i, s, L){
      const active = i===s.currentIndex && !p.eliminated;
      const livesTarget = num((s.modeState||{}).killerLives) || 3;
      const lives = num(p.lives);
      const pips = Array.from({length: Math.max(lives, livesTarget)}, (_,k) =>
        `<span aria-hidden="true">${k < lives ? '●' : '○'}</span>`).join(' ');
      const flash = p.eliminated ? `<div class="flash eliminated">ELIMINATED</div>` : '';
      return `<div class="pcard ${active?'active':''}">
        ${flash}
        <div>
          <div class="prow1">
            <span class="pname">${escapeHtml(p.name)}</span>
            <span class="ptag">№ ${num(p.number)}${p.isKiller?' · 🔪 KILLER':''}</span>
            ${active?'<span class="throwflag">▸ throwing</span>':''}
          </div>
          <div class="score" aria-label="${lives} of ${livesTarget} lives">${pips || '—'}</div>
        </div>
        <div class="meta"><span class="standing">${num(p.kills)} kill${num(p.kills)===1?'':'s'}</span></div>
      </div>`;
    },
    summary(p){
      return buildSummaryCard(p, [
        { value: `№ ${num(p.number)}`, label:'Number' },
        { value: num(p.kills), label:'Kills' },
      ], { nameSuffix: p => p.eliminated ? ' <span style="opacity:.7">☠️</span>' : '' });
    }
  },
  // Dead Man Walking (docs/archive/dead-man-walking-roadmap.md): solo drill,
  // X01-shaped double-out countdown against a par-darts budget — mirrors
  // index.html's own renderGameDeadManWalking() (round-of-15 header, darts left
  // this round, walked-out tally). enterTurnDeadManWalking() broadcasts every
  // committed turn, so without this entry the dispatch fell back to the X01
  // card, which has none of the walk state. s.dmwBudget/dmwDartsUsed/
  // dmwWalkedOut come from liveSnapshot()'s GAME_TYPES.dead_man_walking.
  // liveModeState; the round number rides on the generic s.legNo.
  dead_man_walking: {
    /* Fifteen rounds as cells, the round's remaining score in the big slot. The
       dart budget is the tension, so it leads the sub-line. */
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const results = Array.isArray(ms.dmwRoundResults) ? ms.dmwRoundResults : [];
      const round = num(s.legNo) || 1;
      const left = Math.max(0, num(ms.dmwBudget) - num(ms.dmwDartsUsed));
      const cells = Array.from({length:15}, (_,k)=>{
        const r = results[k];
        if(!r) return pendingCell(k+1 === round ? String(num(p.score)) : '·');
        return { label: String(num(r.target)), glyph: r.walkedOut ? '✓' : '✕',
          state: r.walkedOut ? 'ok' : 'no' };
      });
      if(cells[round-1]) cells[round-1].state = 'now';
      return buildModeLane(p, i, s, L, {
        sub: `round ${round} of 15 · ${left} dart${left===1?'':'s'} left · ${num(ms.dmwWalkedOut)} walked out`,
        cells, big: num(p.score), bigUnit: 'to go',
      });
    },
    resultStats(p){ return [{ v: `${num(p.walkedOut)}/15`, k: 'walked out' }]; },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const ms = s.modeState || {};
      const dartsLeft = Math.max(0, num(ms.dmwBudget) - num(ms.dmwDartsUsed));
      let throwbox = '';
      if(active){
        throwbox = `<div class="throwbox"><div class="darts">${buildDartSlots(s.darts)}</div></div>`;
      }
      const flash = statusFlash(active, s.status, 'WALKED OUT');

      const meta = !L.showMeta ? '' : `<div class="meta"><span class="standing">Round ${num(s.legNo)} of 15 · ${dartsLeft} dart${dartsLeft===1?'':'s'} left · Walked Out ${num(ms.dmwWalkedOut)}</span></div>`;

      return `<div class="pcard ${active?'active':''}">
        ${flash}
        <div>
          <div class="prow1">
            <span class="pname">${escapeHtml(p.name)}</span>
            ${L.showTag ? `<span class="ptag">💀 DOUBLE OUT</span>` : ''}
            ${active?'<span class="throwflag">▸ throwing</span>':''}
          </div>
          <div class="score">${num(p.score)}</div>
        </div>
        ${meta}
        ${throwbox}
      </div>`;
    },
    summary(p){
      // finishUnit()'s DMW legSummary entry is {name, walkedOut, won} — the
      // walked-out tally is the run's headline result (an earlier version read
      // p.gameDarts, a field that entry never carries, so the card always
      // showed 0).
      return buildSummaryCard(p, [{ value: `${num(p.walkedOut)} / 15`, label:'Walked Out' }]);
    }
  },
  // Doubles Practice (docs/game-modes-roadmap.md): solo drill, always exactly one
  // player/card — no legSummary, no scorecard, so this always goes through the
  // generic s.players.map(renderer.card) path below, same as X01.
  doubles_practice: {
    strip(s, L){
      const ms = s.modeState || {};
      const p = s.players[0] || {};
      return singleDartStrip(ms.dpLastDart, ms.roundOver
        ? { k: 'round over', r: `${num(p.roundHits)} of ${num(p.roundDarts)}`,
            note: ms.roundEndReason === 'completed' ? 'every target hit' : 'out of darts' }
        : { k: 'hits this round', r: `${num(p.roundHits)} / ${num(p.roundDarts)}` });
    },
    /* The target doubles as cells, hits over darts in the big slot. A round that
       has ended says so in the sub-line rather than freezing without explanation. */
    lane(p, i, s, L){
      const ms = s.modeState || {};
      const targets = Array.isArray(ms.doublesTargets) ? ms.doublesTargets : [];
      const cells = targets.map(t => ({
        label: t === 25 ? 'Bull' : 'D' + num(t), glyph: '', state: null }));
      const hits = num(p.roundHits), darts = num(p.roundDarts);
      const pct = darts ? Math.round(hits / darts * 100) : 0;
      const sub = ms.roundOver
        ? `round over — ${ms.roundEndReason === 'completed' ? 'all targets hit' : 'out of darts'}`
        : `${targets.length} target${targets.length===1?'':'s'} · ${pct}% hit rate`;
      return laneHtml({
        active: i === s.currentIndex, name: p.name, sub,
        cells: cells.length ? laneCellsHtml(cells) : null,
        stats: cells.length ? null : [{ v: pct + '%', k: 'hit rate' }],
        big: `${hits}/${darts}`, bigUnit: 'hits', bigSmall: true,
      });
    },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const ms = s.modeState || {};
      const targets = Array.isArray(ms.doublesTargets) ? ms.doublesTargets : [];
      const targetLabel = targets.map(n => n===25 ? 'Bull' : 'D'+n).join(', ');
      const pct = p.roundDarts ? Math.round(p.roundHits/p.roundDarts*100) : 0;
      let flash = '';
      if(active && ms.roundOver){
        flash = `<div class="flash bust">${ms.roundEndReason==='so-close' ? 'SO CLOSE' : 'WRONG DOUBLE'}</div>`;
      }
      let throwbox = '';
      if(active && ms.dpLastDart && !ms.roundOver){
        throwbox = buildSingleDartBox(ms.dpLastDart);
      }
      return `<div class="pcard ${active?'active':''}">
        ${flash}
        <div>
          <div class="prow1">
            <span class="pname">${escapeHtml(p.name)}</span>
            ${active?'<span class="throwflag">▸ throwing</span>':''}
          </div>
          <div class="score">${num(p.roundHits)}</div>
          <div class="dart-counts">
            <div class="dart-counts-title">Practicing ${esc(targetLabel)}</div>
            <div class="dart-count-row"><span class="dart-count-val">${pct}%</span><span class="dart-count-lbl">This round</span></div>
            <div class="dart-count-row"><span class="dart-count-val">${num(p.roundDarts)}</span><span class="dart-count-lbl">Darts</span></div>
          </div>
        </div>
        <div class="meta"><span class="standing">Round ${num(s.legNo)}</span></div>
        ${throwbox}
      </div>`;
    }
  },
  // Just Chuckin' It (docs/game-modes-roadmap.md): solo, freeform, no rounds/legs
  // at all — always exactly one player/card, no legSummary, no scorecard, so this
  // always goes through the generic s.players.map(renderer.card) path below.
  // p.heatmap/p.sessionAvg come from index.html's playerSnapshotChuckin() — a
  // live, session-only tally (gradually fills in as the session progresses),
  // a separate concept from the lifetime heatmap the Player Profile fetches.
  chuckin: {
    strip(s, L){
      const run = ((s.modeState||{}).chuckinRecent) || [];
      const runHtml = run.length
        ? run.slice(-9).map(d => `<span class="c${d.isTreble ? ' t' : d.isMiss ? ' m' : ''}">${esc(d.label)}</span>`).join('')
        : '';
      return singleDartStrip((s.modeState||{}).chuckinLastDart,
        runHtml ? { k: 'last nine darts', runHtml } : null);
    },
    /* No score, no target, no round — so the heatmap of where the session has
       actually landed is the only thing there is to show, and it gets the whole
       stage rather than a thumbnail beside a card. */
    stage(s, L){
      const p = s.players[0] || {};
      const darts = num(p.sessionDarts);
      const trebles = num(p.sessionTrebles);
      const avgNum = p.sessionAvg == null ? null : Number(p.sessionAvg);
      const avg = Number.isFinite(avgNum) ? avgNum.toFixed(1) : '—';
      const run = ((s.modeState||{}).chuckinRecent) || [];
      return stageSideHtml({
        eyebrow: '▸ throwing', name: p.name || '',
        hero: darts, heroUnit: 'darts',
        sub: 'nothing to win, nothing to bust',
        stats: [
          { v: avg, k: '3-dart average' },
          { v: darts ? Math.round(trebles/darts*100) + '%' : '0%', k: 'trebles' },
          { v: trebles, k: 'trebles' },
        ],
        chalk: run.length
          ? 'last darts · ' + run.slice(-6).map(d => d.isTreble ? `<em>${esc(d.label)}</em>` : esc(d.label)).join(' · ')
          : '',
      }) +
      `<div class="stage-board">
        <span class="stage-cap">where this session has landed</span>
        ${buildChuckinLiveHeatmap(p.heatmap || [])}
      </div>`;
    },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const pct = p.sessionDarts ? Math.round(p.sessionTrebles/p.sessionDarts*100) : 0;
      // docs/bug-roadmap.md BUG-12: p.sessionAvg comes straight from the /api/live
      // broadcast payload's per-player array, which ALLOWED_LIVE_KEYS deliberately
      // leaves unrestricted in shape — a non-numeric value here previously called
      // .toFixed(1) directly and threw inside renderState()'s render loop, freezing
      // the whole scoreboard on every subsequent live event. null/undefined is the
      // legitimate "no darts thrown yet this session" case (Number(null) is 0, NOT
      // NaN, so it has to be excluded explicitly rather than folded into the same
      // Number.isFinite() check as actual garbage) — Number.isFinite() then guards
      // everything else the same way num() already guards every other live-payload
      // numeric field in this file.
      const sessionAvgNum = p.sessionAvg == null ? null : Number(p.sessionAvg);
      const avgText = Number.isFinite(sessionAvgNum) ? sessionAvgNum.toFixed(1) : '—';
      let throwbox = '';
      const chuckinLastDart = (s.modeState||{}).chuckinLastDart;
      if(active && chuckinLastDart){
        const treble = chuckinLastDart.isTreble ? '<span class="flash shot" style="position:static;display:inline-block;margin-left:8px">TREBLE</span>' : '';
        throwbox = buildSingleDartBox(chuckinLastDart, treble);
      }
      return `<div class="pcard ${active?'active':''}">
        <div class="chuckin-layout">
          <div class="chuckin-stats">
            <div class="prow1">
              <span class="pname">${escapeHtml(p.name)}</span>
              ${active?'<span class="throwflag">▸ throwing</span>':''}
            </div>
            <div class="score">${num(p.sessionDarts)}</div>
            <div class="dart-counts">
              <div class="dart-counts-title">Just chuckin' it</div>
              <div class="dart-count-row"><span class="dart-count-val">${avgText}</span><span class="dart-count-lbl">3-dart average</span></div>
              <div class="dart-count-row"><span class="dart-count-val">${pct}%</span><span class="dart-count-lbl">Trebles this session</span></div>
              <div class="dart-count-row"><span class="dart-count-val">${num(p.sessionTrebles)}</span><span class="dart-count-lbl">Trebles</span></div>
            </div>
            ${throwbox}
          </div>
          <div class="chuckin-board">${buildChuckinLiveHeatmap(p.heatmap||[])}</div>
        </div>
      </div>`;
    }
  },
  // Guided Around the Clock (docs/game-modes-roadmap.md): solo drill, always
  // exactly one player/card — no legSummary, no scorecard, goes through the
  // generic s.players.map(renderer.card) path, same as Doubles Practice/Chuckin.
  around_the_clock: {
    strip(s, L){
      const p = s.players[0] || {};
      const hit = Array.isArray(p.hitNumbers) ? p.hitNumbers.map(Number) : [];
      const left = [...Array(20)].map((_,k)=>k+1).filter(n => !hit.includes(n));
      return singleDartStrip((s.modeState||{}).atcLastDart,
        left.length ? { k: 'next number', r: String(left[0]),
          note: `${left.length} number${left.length===1?'':'s'} to go` }
        : { k: 'the clock is clear', r: `${num(p.roundDarts)} darts` });
    },
    /* Direction C, the owner's pick for the two guided drills: the dial centre
       stage. The old card had this board already and floated it in ~60% empty
       space with a lone dart chip; here it is the subject, with the run's own
       figures either side of it. */
    stage(s, L){
      const p = s.players[0] || {};
      const hit = Array.isArray(p.hitNumbers) ? p.hitNumbers.map(Number) : [];
      const darts = num(p.roundDarts);
      const left = [...Array(20)].map((_,k)=>k+1).filter(n => !hit.includes(n));
      const perNumber = hit.length ? (darts / hit.length).toFixed(1) : '—';
      return stageSideHtml({
        eyebrow: '▸ at the oche', name: p.name || '',
        hero: `${hit.length}`, heroUnit: '/ 20',
        sub: 'numbers cleared',
        stats: [
          { v: darts, k: 'darts' },
          { v: perNumber, k: 'darts per number' },
          { v: num(p.roundTrebles), k: 'trebles' },
          { v: num(p.roundMisses), k: 'misses' },
        ],
      }) +
      `<div class="stage-board">
        <span class="stage-cap">${left.length ? `next up · ${left[0]}` : 'clock complete'}</span>
        ${buildClockBoard(hit)}
      </div>` +
      stageSideHtml({
        right: true, name: 'Still to hit',
        chalk: left.length ? left.join(' · ') : '<em>every number hit</em>',
        stats: [{ v: left.length, k: left.length === 1 ? 'number left' : 'numbers left' }],
      });
    },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const ms = s.modeState || {};
      const hitNumbers = Array.isArray(p.hitNumbers) ? p.hitNumbers : [];
      // No "CLOCK COMPLETE" flash branch here (2026-07): completing the clock
      // now ends the whole game immediately (finishUnit('game', ...)), so by
      // the time roundOver ever broadcasts true, s.legSummary is ALSO already
      // set — render()'s own legSummary branch takes over before this card
      // would ever draw a completed state, the same "a run IS the game" shape
      // Gauntlet/Bob's 27/Dead Man Walking's cards never needed a live/done
      // hybrid state for either.
      let throwbox = '';
      if(active && ms.atcLastDart){
        throwbox = buildSingleDartBox(ms.atcLastDart);
      }
      return `<div class="pcard ${active?'active':''}">
        <div class="chuckin-layout">
          <div class="chuckin-stats">
            <div class="prow1">
              <span class="pname">${escapeHtml(p.name)}</span>
              ${active?'<span class="throwflag">▸ throwing</span>':''}
            </div>
            <div class="score">${num(p.hit)}<span style="font-size:0.4em;opacity:.7"> / 20</span></div>
            <div class="dart-counts">
              <div class="dart-counts-title">Around the Clock</div>
              <div class="dart-count-row"><span class="dart-count-val">${num(p.roundDarts)}</span><span class="dart-count-lbl">Darts thrown</span></div>
            </div>
            ${throwbox}
          </div>
          <div class="clock-board">${buildClockBoard(hitNumbers)}</div>
        </div>
      </div>`;
    },
    // CLOCK COMPLETE — the live-scoreboard half of the "every completed game
    // gets a stats screen" work (2026-07): darts/trebles/doubles/misses/
    // duration for the just-finished clock, mirroring index.html's own
    // aroundTheClockSummary block on the in-app GAME OVER screen (same
    // underlying legSummary entry, two renderings of the same data).
    summary(p){
      const mins = Math.floor((p.durationSec||0)/60), secs = (p.durationSec||0)%60;
      return buildSummaryCard(p, [
        { value: num(p.darts), label:'Darts' },
        { value: num(p.trebles), label:'Trebles' },
        { value: num(p.doubles), label:'Doubles' },
        { value: num(p.misses), label:'Misses' },
        { value: `${mins}:${String(secs).padStart(2,'0')}`, label:'Time' },
      ], { noWinner:true });
    }
  },
  // Guided Around the World (docs/game-modes-roadmap.md): solo, no rounds/legs at
  // all — always exactly one player/card, same shape as Chuckin.
  around_the_world: {
    strip(s, L){
      const p = s.players[0] || {};
      const done = Array.isArray(p.hitOutcomes) ? p.hitOutcomes.length : 0;
      return singleDartStrip((s.modeState||{}).atwLastDart,
        { k: 'this session', r: `${done} / 63`,
          note: `${63 - done} outcome${63 - done === 1 ? '' : 's'} to go` });
    },
    /* The same treatment, over 63 outcomes instead of 20 numbers. A ring whose
       wedges are split into the three outcomes each number owes shows a
       part-finished number at a glance, which the 63-cell grid never did across
       a room. */
    stage(s, L){
      const p = s.players[0] || {};
      const keys = Array.isArray(p.hitOutcomes) ? p.hitOutcomes : [];
      const hit = new Set(keys);
      const darts = num(p.sessionDarts);
      const done = [...Array(20)].map((_,k)=>k+1).filter(n => [1,2,3].every(m => hit.has(n+':'+m)));
      const perOutcome = hit.size ? (darts / hit.size).toFixed(1) : '—';
      return stageSideHtml({
        eyebrow: '▸ at the oche', name: p.name || '',
        hero: `${hit.size}`, heroUnit: '/ 63',
        sub: 'outcomes hit this session',
        stats: [
          { v: darts, k: 'darts' },
          { v: perOutcome, k: 'darts per outcome' },
          { v: done.length, k: 'numbers finished' },
        ],
      }) +
      `<div class="stage-board">
        <span class="stage-cap">single · treble · double, reading outward</span>
        ${buildWorldRing(keys)}
      </div>` +
      stageSideHtml({
        right: true, name: 'The extras',
        stats: [
          { v: hit.has('25:1') ? '✓' : '—', k: 'outer bull' },
          { v: hit.has('25:2') ? '✓' : '—', k: 'double bull' },
          { v: hit.has('0:1') ? '✓' : '—', k: 'a miss' },
        ],
        chalk: `<em>${63 - hit.size}</em> outcomes to go`,
      });
    },
    card(p, i, s, L){
      const active = i===s.currentIndex;
      const hitOutcomes = Array.isArray(p.hitOutcomes) ? p.hitOutcomes : [];
      const atwLastDart = (s.modeState||{}).atwLastDart;
      let throwbox = '';
      if(active && atwLastDart){
        const newOutcome = atwLastDart.isNewLifetimeOutcome ? '<span class="flash shot" style="position:static;display:inline-block;margin-left:8px">NEW!</span>' : '';
        throwbox = buildSingleDartBox(atwLastDart, newOutcome);
      }
      return `<div class="pcard ${active?'active':''}">
        <div class="chuckin-layout">
          <div class="chuckin-stats">
            <div class="prow1">
              <span class="pname">${escapeHtml(p.name)}</span>
              ${active?'<span class="throwflag">▸ throwing</span>':''}
            </div>
            <div class="score">${num(p.progress)}<span style="font-size:0.4em;opacity:.7"> / 63</span></div>
            <div class="dart-counts">
              <div class="dart-counts-title">Around the World</div>
              <div class="dart-count-row"><span class="dart-count-val">${num(p.sessionDarts)}</span><span class="dart-count-lbl">Darts this session</span></div>
            </div>
            ${throwbox}
          </div>
          <div class="chuckin-board">${buildOutcomeGridCompact(hitOutcomes)}</div>
        </div>
      </div>`;
    }
  }
};
// Traditional chalkboard marks: blank (0), / (1), X (2), circled X (3+/closed).
// The circle is the accessibility signal (docs/accessibility-roadmap.md) — closed
// status never relies on color alone.
function cricketMarkGlyph(n, numberLabel){
  const sr = n>=3 ? `<span class="sr-only">${numberLabel} closed</span>` : (n>0 ? `<span class="sr-only">${numberLabel}: ${n} of 3 marks</span>` : '');
  if(n<=0) return sr;
  if(n===1) return `<span class="cs-mark cs-mark-1" aria-hidden="true">/</span>${sr}`;
  if(n===2) return `<span class="cs-mark cs-mark-2" aria-hidden="true">✕</span>${sr}`;
  return `<span class="cs-mark cs-mark-3" aria-hidden="true">✕</span>${sr}`;
}


/* ================= LOWER THIRD helpers =================================
   Shared by every mode's lane(), so a lane states only what is genuinely its
   own — its headline number, its cells — and inherits the rest.
   ======================================================================= */

// One lane. `o` is { active, session, out, name, sub, recent, stats, cells,
// big, bigUnit, bigSmall, lead } — every field optional except name.
function laneHtml(o){
  const cls = 'lane' + (o.active ? ' on' : '') + (o.session ? ' session' : '') + (o.out ? ' out' : '')
    + (o.result ? ' result' : '');
  const who = `<div class="lane-who">
      <div class="lane-name">${esc(o.name)}</div>
      ${o.sub ? `<div class="lane-sub">${esc(o.sub)}</div>` : ''}
      ${o.recent ? `<div class="lane-recent"><span class="k">${esc(o.recentLabel || 'this leg')}</span>` +
        `<span class="v">${o.recent}</span></div>` : ''}
    </div>`;
  const middle = o.cells != null ? `<div class="lane-cells">${o.cells}</div>`
    : `<div class="lane-stats">${(o.stats || []).map(st =>
        `<div class="lst${st.dim ? ' dim' : ''}"><span class="v">${esc(st.v)}</span>` +
        `<span class="k">${esc(st.k)}</span></div>`).join('')}</div>`;
  const big = o.big == null ? '' :
    `<div class="lane-big${o.bigSmall ? ' small' : ''}">${esc(o.big)}` +
    `${o.bigUnit ? `<span class="u">${esc(o.bigUnit)}</span>` : ''}</div>`;
  return `<div class="${cls}"><span class="lane-arrow">▸</span>${o.lead || ''}${who}${middle}${big}</div>`;
}

// The chalked run of recent visits. A bust is struck through and a checkout is
// gold — the two things worth picking out of a column of numbers at a glance.
function laneRecentHtml(recent){
  if(!Array.isArray(recent) || !recent.length) return '';
  return recent.map(r => r.bust ? `<s>${num(r.scored)}</s>`
    : r.checkout ? `<em>${num(r.scored)}</em>` : String(num(r.scored))).join(' · ');
}

// A row of per-round cells inside a lane. `state` is 'ok' | 'no' | 'now' | null
// and is always paired with the cell's own glyph, never left to colour alone.
function laneCellsHtml(cells){
  // `glyph` is TEXT and is escaped; `glyphHtml` is markup a caller has already
  // built safely (Cricket's mark glyphs carry a screen-reader span, so they
  // cannot go through esc() — doing that printed the tag source into the cell).
  // Two fields rather than a flag, so which one escapes is greppable.
  return cells.map(c =>
    `<div class="lcell${c.state ? ' ' + c.state : ''}">` +
    `<div class="n">${esc(c.label)}</div>` +
    `<div class="g">${c.glyphHtml != null ? c.glyphHtml : esc(c.glyph == null ? '' : c.glyph)}</div></div>`
  ).join('');
}

/* The throw strip — the permanent band the whole direction is built around.

   Generic by default: the darts in hand, what they are worth, and (for the
   modes that have one) the checkout route. A mode overrides any pane by
   declaring strip(s, L), which returns { darts, visit, need } — see the
   Chuckin renderer, whose mode has no requirement to state and fills the need
   pane with its own recent run instead. */
function renderStrip(renderer, s, L){
  if(s.legSummary || s.done || !L.showStrip){
    strip.classList.add('hidden'); lastStripKey = ''; return;
  }
  const spec = typeof renderer.strip === 'function' ? renderer.strip(s, L) : defaultStripSpec(s);
  if(!spec){ strip.classList.add('hidden'); lastStripKey = ''; return; }

  const key = JSON.stringify(spec);
  if(key !== lastStripKey){
    lastStripKey = key;
    const slots = spec.darts || [];
    stripDarts.innerHTML = slots.map(d => d.pending
      ? `<span class="sdart pending">${esc(d.label)}</span>`
      : `<span class="sdart ${esc(d.cls || '')}${spec.solo ? ' solo' : ''}">${esc(d.label)}</span>`).join('');
    if(spec.visit){
      stripVisitK.textContent = spec.visit.k;
      stripVisitV.innerHTML = esc(spec.visit.v) + (spec.visit.unit ? `<small> ${esc(spec.visit.unit)}</small>` : '');
      stripVisit.classList.remove('hidden');
    } else {
      stripVisit.classList.add('hidden');
    }
    const need = spec.need;
    stripNeed.innerHTML = !need ? '' :
      `<span class="k">${esc(need.k)}</span>` +
      (need.runHtml
        ? `<div class="strip-run">${need.runHtml}</div>`
        : `<span class="r${need.small ? ' sm' : ''}">${esc(need.r)}</span>`) +
      (need.note ? `<span class="note">${esc(need.note)}</span>` : '');
  }
  strip.classList.remove('hidden');
}

// The X01-shaped default: three dart slots, the visit total, the checkout route.
function defaultStripSpec(s){
  const thrower = s.players[s.currentIndex];
  const labels = Array.isArray(s.darts) ? s.darts : [];
  const darts = [0,1,2].map(i => labels[i] != null
    ? { label: labels[i], cls: dartClass(labels[i]) }
    : { label: `dart ${i+1}`, pending: true });
  const left = 3 - labels.length;
  const route = s.checkout ? formatCheckoutRoute(s.checkout) : '';
  return {
    darts,
    visit: { k: 'this visit', v: num(s.visitScored) },
    need: route ? {
      k: `${thrower ? thrower.name : ''} needs · ${left} dart${left===1?'':'s'}`,
      r: route,
      small: route.length > 14,
    } : null,
  };
}


/* ---- the post-leg / post-match result view -------------------------------
   Composed from the same laneHtml() the live board uses, so the lanes stay in
   the positions they held during play and only their contents change. */

// camelCase field name -> a label a person would say out loud. Used for the
// generic fallback below, so a mode that hasn't declared resultStats() yet
// still shows real numbers with real labels rather than nothing.
function humaniseKey(k){
  return String(k).replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toLowerCase();
}
const RESULT_LABELS = { avg:'average', darts:'darts', busts:'busts', points:'points',
  closed:'numbers closed', totalRuns:'runs', totalPoints:'points', total:'total',
  totalCp:'composure points', rating:'rating', running:'final score', kills:'kills',
  number:'their number', walkedOut:'walked out', outcomes:'outcomes hit',
  trebles:'trebles', doubles:'doubles', misses:'misses', durationSec:'time' };

// Every numeric/text field the mode's own legSummary row carries, minus the two
// that are structural rather than statistical. A mode overrides this by
// declaring resultStats(p, s) when it wants a different order or wording.
function resultStatsFromRow(p){
  return Object.keys(p)
    .filter(k => k !== 'name' && k !== 'won' && p[k] != null && p[k] !== '')
    .map(k => ({ v: k === 'durationSec' ? fmtDuration(p[k]) : p[k],
                 k: RESULT_LABELS[k] || humaniseKey(k) }));
}
function fmtDuration(sec){
  const n = num(sec);
  return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
}

// "LEG 3 TO BEN" / "BEN WINS THE MATCH" / "LEG 18 COMPLETE" — what a
// commentator would say, stated once and large. s.message is the controller's
// own wording for this exact moment (already solo-practice aware), so it is the
// source rather than something re-derived here and liable to drift from it.
function verdictText(s){
  if(s.done) return s.doneHeading || 'GAME OVER';
  if(s.message) return s.message;
  // A leg-summary push can arrive with no wording (the controller only sends a
  // message on the push that ANNOUNCES the result; later pushes carry the same
  // summary with message:''). Naming the winner beats a bare "LEG COMPLETE"
  // that a two-player room has to work out for itself.
  const winner = (s.legSummary || []).find(r => r.won);
  if(winner && (s.legSummary || []).length > 1) return `${winner.name} takes the leg`;
  return 'LEG COMPLETE';
}

function renderResultView(renderer, s, L){
  const rows = s.legSummary || [];
  const statsFor = typeof renderer.resultStats === 'function'
    ? (p => renderer.resultStats(p, s)) : resultStatsFromRow;
  const winner = rows.find(r => r.won);

  // The verdict line pairs the result with what it cost — the two facts that
  // belong in the same breath, and the reason this isn't just a heading.
  const cost = [];
  if(winner){
    if(winner.darts != null) cost.push(`<b>${num(winner.darts)}</b> darts`);
    if(winner.avg  != null) cost.push(`<b>${esc(winner.avg)}</b> average`);
  }
  verdict.innerHTML = `<span class="v">${esc(verdictText(s))}</span>` +
    (cost.length ? `<span class="cost">${cost.join(' · ')}</span>` : '');
  verdict.classList.remove('hidden');

  const laneHtmlFor = (p, i) => {
    const stats = statsFor(p) || [];
    // The headline of a result lane is the FIRST stat the mode names — its own
    // answer to "how did that go" (an average in X01, points in Cricket, runs
    // in Baseball) — with the rest running across the lane beside it.
    const head = stats[0] || null;
    return laneHtml({
      result: true,
      active: !!p.won && rows.length > 1,
      name: p.name + (p.won && rows.length > 1 ? ' 🏆' : ''),
      sub: head ? head.k : '',
      stats: stats.slice(1),
      big: head ? head.v : null,
      bigSmall: head ? String(head.v).length > 5 : false,
    });
  };
  grid.className = 'lanes';
  grid.style.gridTemplateColumns = '';
  grid.innerHTML = rows.map(laneHtmlFor).join('');

  // The tally band, in the app's established emoji vocabulary — the same
  // counters the top bar carries during play, restated at result scale because
  // this is the moment they are actually read.
  const t = [
    { em:'🎯', v:num(s.gameOneEighties), k: num(s.gameOneEighties)===1 ? '180' : '180s' },
    { em:'🐟', v:num(s.gameBigFish),     k:'big fish' },
    { em:'💥', v:num(s.gameBusts),       k:'busts' },
  ];
  tallies.innerHTML = t.map(x =>
    `<span class="tly${x.v ? '' : ' zero'}"><span class="em" aria-hidden="true">${x.em}</span>` +
    `<span class="v">${x.v}</span><span class="k">${esc(x.k)}</span></span>`).join('') +
    (s.done ? '' : `<span class="tly next"><span class="k">Next leg coming up</span></span>`);
  tallies.classList.remove('hidden');
}


/* ---- per-mode lanes for the round-based modes ----------------------------
   Cricket, Baseball, Shanghai, Halve-It and The Pressure Chamber are one idea
   wearing five names: a fixed sequence of rounds, a running total, and a card
   showing how each round went. So they share one lane shape — the sequence as
   .lane-cells across the middle, the total in the big slot — rather than five
   full-width tables that each pushed the rest of the screen into a hole.

   buildModeLane() is the shared body; each mode supplies only its own cells,
   its own headline number and its own sub-line. */
// A Halve-It target as a label. `short` is for a lane cell, where there is room
// for "D20" but not "Double 20". Hoisted out of the scorecard renderer that used
// to own it inline, so the lane and the table can never drift apart on wording.
function halveItTargetLabel(t, short){
  if(!t) return '';
  const n = t.sector === 25 ? 'Bull' : String(t.sector);
  if(!t.ring) return n;
  if(short) return (t.ring === 'double' ? 'D' : t.ring === 'treble' ? 'T' : '') + n;
  const ring = t.ring === 'double' ? 'Double' : t.ring === 'treble' ? 'Treble' : 'Single';
  return `${ring} ${n}`;
}


// One side of a stage layout. Mirrors laneHtml()'s option shape so the two
// layouts stay recognisably the same design rather than two separate ideas.

/* The throw strip for a mode that commits PER DART — Around the Clock, Around
   the World, Just Chuckin' It, Doubles Practice, Killer. Three pending slots
   and a visit total are both lies there: there is no visit to total and there
   are not three darts pending, so one slot carries the dart that just landed
   and the visit pane states its value instead. */
function singleDartStrip(lastDart, need){
  const label = lastDart && lastDart.label ? lastDart.label : null;
  return {
    solo: true,
    darts: [label ? { label, cls: dartClass(label) } : { label: 'first dart', pending: true }],
    visit: label ? { k: 'that dart', v: dartScoreOf(label) } : null,
    need: need || null,
  };
}
// The value of a dart from its label — the strip has the label, not the number,
// and this file has no shared scoring module to ask.
function dartScoreOf(label){
  const t = String(label || '');
  if(t === 'Miss') return 0;
  if(t === 'Bull') return 50;
  if(t === '25') return 25;
  const m = /^([TD]?)(\d+)$/.exec(t);
  if(!m) return 0;
  return Number(m[2]) * (m[1] === 'T' ? 3 : m[1] === 'D' ? 2 : 1);
}

function stageSideHtml(o){
  return `<div class="stage-side${o.right ? ' r' : ''}">
    ${o.eyebrow ? `<div class="stage-sub" style="color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:700">${esc(o.eyebrow)}</div>` : ''}
    <div class="stage-name">${esc(o.name)}</div>
    ${o.hero == null ? '' : `<div class="stage-hero">${esc(o.hero)}${o.heroUnit ? `<span class="u">${esc(o.heroUnit)}</span>` : ''}</div>`}
    ${o.sub ? `<div class="stage-sub">${esc(o.sub)}</div>` : ''}
    ${(o.stats && o.stats.length) ? `<div class="stage-stats">${o.stats.map(st =>
      `<div class="lst"><span class="v">${esc(st.v)}</span><span class="k">${esc(st.k)}</span></div>`).join('')}</div>` : ''}
    ${o.chalk ? `<div class="stage-chalk">${o.chalk}</div>` : ''}
  </div>`;
}

// The Around the World ring: twenty wedges, each split into the three outcomes
// that number owes (single / treble / double, reading outward exactly as the
// real board does), plus the two bulls at the centre. A number part-way done
// reads at a glance, which a 63-cell grid never did across a room.
function buildWorldRing(hitKeys){
  const hit = new Set(Array.isArray(hitKeys) ? hitKeys : []);
  const { CX, CY, R, DEG, xy, annulus } = BOARD_GEOM;
  const on  = 'var(--gold)';
  const off = 'rgba(255,255,255,.05)';
  let out = `<svg viewBox="0 0 660 660" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="Around the World board — ${hit.size} of 63 outcomes hit">
    <circle cx="${CX}" cy="${CY}" r="${R.doubleOut+1}" fill="#111210"/>`;
  DB_SECTORS.forEach((n,i)=>{
    const st = i*DEG - DEG/2, en = st + DEG;
    const band = (r1, r2, mult) =>
      `<path d="${annulus(r1, r2, st, en)}" fill="${hit.has(n+':'+mult) ? on : off}"
        stroke="#1b2a24" stroke-width="1"/>`;
    out += band(R.bullOut, R.trebleIn, 1);      // single (inner)
    out += band(R.trebleIn, R.trebleOut, 3);    // treble
    out += band(R.trebleOut, R.doubleIn, 1);    // single (outer) — same outcome as inner
    out += band(R.doubleIn, R.doubleOut, 2);    // double
    const [tx,ty] = xy(R.numAt, i*DEG);
    const done = [1,2,3].every(m => hit.has(n+':'+m));
    out += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="${done ? on : '#8b958e'}"
      font-size="20" font-family="Inter" font-weight="700" text-anchor="middle"
      dominant-baseline="central">${n}</text>`;
  });
  out += `<circle cx="${CX}" cy="${CY}" r="${R.bullOut}" fill="${hit.has('25:1') ? on : off}" stroke="#1b2a24"/>`;
  out += `<circle cx="${CX}" cy="${CY}" r="${R.bullIn}"  fill="${hit.has('25:2') ? on : off}" stroke="#1b2a24"/>`;
  return out + '</svg>';
}

function buildModeLane(p, i, s, L, o){
  const active = i === s.currentIndex;
  return laneHtml({
    active, name: p.name, sub: o.sub,
    cells: laneCellsHtml(o.cells),
    big: o.big, bigUnit: o.bigUnit, bigSmall: o.bigSmall,
  });
}
// A cell for a round that has not been reached yet. Kept as its own helper so
// "not played" looks identical in all five modes.
function pendingCell(label){ return { label, glyph: '', state: null }; }

/* ---- voice announcements ----
   Spoken call-outs using the browser's built-in speechSynthesis (SpeechSynthesisUtterance)
   plus a procedurally-synthesized splash effect (Web Audio API) for Big Fish — zero
   server involvement, zero external services, zero new dependencies, matching
   docs/archive/voice-announcements-roadmap.md. Multi-language support is left entirely to
   whatever voice/locale the browser already provides (see
   docs/voice-announcements-i18n-roadmap.md for what a real i18n implementation would
   need beyond that). Off by default; each call-out type is independently toggleable
   from Settings -> Voice Announcements. */
let VOICE = { enabled:false, turnScore:true, noScore:true, checkoutReq:true, oneEighty:true, bigFish:true, matchProgress:true };
function voiceOn(key){ return !!(VOICE.enabled && VOICE[key]); }

// Sequential queue so overlapping events (e.g. a Big Fish that also wins the leg)
// speak/play one at a time instead of talking over each other.
const _announceQueue = [];
let _announcing = false;
function queueSpeech(chunks){ _announceQueue.push({ type:'speech', chunks }); _processQueue(); }
function queueSound(playFn){ _announceQueue.push({ type:'sound', play:playFn }); _processQueue(); }
function _processQueue(){
  if(_announcing || !_announceQueue.length) return;
  _announcing = true;
  const item = _announceQueue.shift();
  if(item.type === 'sound'){
    Promise.resolve().then(item.play).catch(()=>{}).then(()=>{ _announcing=false; _processQueue(); });
    return;
  }
  const chunks = item.chunks.slice();
  const speakNext = () => {
    if(!chunks.length){ _announcing=false; _processQueue(); return; }
    const c = chunks.shift();
    const u = new SpeechSynthesisUtterance(c.text);
    u.pitch = c.pitch; u.rate = c.rate; u.volume = c.volume;
    u.onend = speakNext; u.onerror = speakNext;
    speechSynthesis.speak(u);
  };
  speakNext();
}

function ordinal(n){
  n = Number(n) || 0;
  const v = n % 100;
  const suf = (v >= 11 && v <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
  return n + suf;
}

// "One! Hundred! and! Eighty!!" — escalating pitch and slowing rate word-by-word.
// The Web Speech API can't bend pitch mid-utterance or reliably stretch a vowel
// ("eighhhhty"), so this simulates the drawn-out hype-announcer effect by queuing
// each word as its own utterance with a rising pitch and slower rate.
function announce180(){
  queueSpeech([
    { text:'One',     pitch:0.95, rate:0.85, volume:1.0 },
    { text:'Hundred', pitch:1.1,  rate:0.85, volume:1.0 },
    { text:'and',     pitch:1.25, rate:0.8,  volume:1.0 },
    { text:'Eighty!', pitch:1.5,  rate:0.65, volume:1.0 },
  ]);
}

// Procedurally-synthesized splash/flop effect (filtered decaying noise bursts) rather
// than a recorded audio file — keeps this dependency-free and licensing-free. Swap in
// a real sound file later by replacing this function's body if you'd rather.
let _actx = null;
function playBigFishSplash(){
  return new Promise(resolve=>{
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return resolve();
      const ctx = _actx || (_actx = new Ctx());
      const now = ctx.currentTime;
      const flop = (start, len, vol) => {
        const n = Math.max(1, Math.floor(ctx.sampleRate * len));
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1 - i/n);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=900; filter.Q.value=0.6;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(vol, now+start);
        gain.gain.exponentialRampToValueAtTime(0.001, now+start+len);
        src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
        src.start(now+start);
      };
      flop(0, 0.28, 0.5); flop(0.32, 0.22, 0.35); flop(0.58, 0.18, 0.25);
      setTimeout(resolve, 900);
    }catch(e){ resolve(); }
  });
}

let _lastTurnEventTs = 0, _lastCheckoutTurnSeq = -1, _lastMatchResultTs = 0, _lastLegStartTs = 0;
function handleVoiceEvents(s){
  if(!VOICE.enabled) return;

  if(s.lastTurnEvent && s.lastTurnEvent.ts !== _lastTurnEventTs){
    _lastTurnEventTs = s.lastTurnEvent.ts;
    const ev = s.lastTurnEvent;
    if(!ev.win){   // a winning turn is narrated by matchResult below instead
      if(ev.bust || ev.scored === 0){
        if(voiceOn('noScore')) queueSpeech([{ text:'No Score', pitch:0.65, rate:0.85, volume:0.9 }]);
      } else if(ev.scored === 180){
        if(voiceOn('oneEighty')) announce180();
      } else if(voiceOn('turnScore')){
        queueSpeech([{ text:String(ev.scored), pitch:1.0, rate:1.0, volume:1.0 }]);
      }
    }
  }

  if(s.checkoutTarget && s.turnSeq !== _lastCheckoutTurnSeq){
    _lastCheckoutTurnSeq = s.turnSeq;
    if(voiceOn('checkoutReq')){
      const ct = s.checkoutTarget;
      queueSpeech([{ text:`${ct.player}, you require ${ct.score}`, pitch:1.0, rate:0.95, volume:1.0 }]);
    }
  }

  if(s.matchResult && s.matchResult.ts !== _lastMatchResultTs){
    _lastMatchResultTs = s.matchResult.ts;
    const mr = s.matchResult;
    if(voiceOn('matchProgress')){
      const phrase = mr.kind === 'leg' ? `Game shot! And the ${ordinal(mr.legNo)} leg, ${mr.winner}!`
        : mr.kind === 'set' ? `Game shot! And the ${ordinal(mr.setNo)} set, ${mr.winner}!`
        : `Game shot! And the match, ${mr.winner}!`;
      queueSpeech([{ text:phrase, pitch:1.1, rate:1.0, volume:1.0 }]);
    }
    if(mr.bigFish && voiceOn('bigFish')) queueSound(playBigFishSplash);
  }

  if(s.legStart && s.legStart.ts !== _lastLegStartTs){
    _lastLegStartTs = s.legStart.ts;
    if(voiceOn('matchProgress')){
      queueSpeech([{ text:`${s.legStart.starter} to throw first, Game On!`, pitch:1.1, rate:1.05, volume:1.0 }]);
    }
  }
}

// Most browsers block audio (speech synthesis and Web Audio alike) until the page
// has had a user gesture. /display is typically left open on a TV with nobody
// touching it, so surface a one-tap prompt to unlock audio rather than silently
// having the first few announcements never be heard.
const voiceUnlock = document.createElement('button');
voiceUnlock.textContent = '🔊 Tap to enable voice announcements';
voiceUnlock.style.cssText = 'position:fixed;bottom:2vmin;right:2vmin;z-index:40;padding:1.2vmin 2vmin;'+
  'border-radius:1vmin;border:1px solid var(--gold);background:var(--surface-2);color:var(--gold);'+
  'font:inherit;font-size:1.6vmin;cursor:pointer';
voiceUnlock.hidden = true;
document.body.appendChild(voiceUnlock);
voiceUnlock.addEventListener('click', ()=>{
  try{ const Ctx = window.AudioContext || window.webkitAudioContext; if(Ctx) (_actx || (_actx = new Ctx())).resume(); }catch(e){}
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  voiceUnlock.hidden = true;
});
fetch('/api/settings/voice-announcements', {cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{
  if(s) VOICE = s;
  if(VOICE.enabled) voiceUnlock.hidden = false;
}).catch(()=>{});

function render(s){
  lastSnapshot = s;
  if(!s || !s.active){
    grid.classList.add('hidden'); idle.classList.remove('hidden');
    fmtEl.innerHTML=''; banner.classList.remove('show'); bannerKey='';
    gameStats.classList.add('hidden');
    strip.classList.add('hidden'); lastStripKey='';
    verdict.classList.add('hidden'); tallies.classList.add('hidden');
    standing.classList.add('hidden'); lastStandingKey='';
    return;
  }

  idle.classList.add('hidden'); grid.classList.remove('hidden');
  if(!Array.isArray(s.players)) s.players = [];   // tolerate malformed snapshots
  fmtEl.innerHTML = fmtText(s);

  const renderer = renderers[s.gameType] || renderers.x01;
  const L = LAYOUTS[layout] || LAYOUTS.full;

  // 180s + Big Fish in top bar (Full layout only — secondary info on Compact/Minimal)
  if(L.showGameStats){
    gameStats.classList.remove('hidden');
    stat180s.textContent  = s.gameOneEighties ?? 0;
    statBF.textContent    = s.gameBigFish     ?? 0;
    statBusts.textContent = s.gameBusts       ?? 0;
  } else {
    gameStats.classList.add('hidden');
  }

  const thrower = s.players[s.currentIndex];

  // Standing, in the top bar. The old .matchbar sat below it as its own strip
  // and repeated every player's name a second time, directly above the cards
  // that already printed them — so it says the score of the match and nothing
  // else now, and whose turn it is has moved onto the lane where it belongs.
  const showStanding = !s.practice && s.players.length > 1;
  if(showStanding){
    const showSets = num(s.setsPerGame) > 1;
    const showLegs = showSets || num(s.legsPerSet) > 1;
    const key = showSets+'|'+showLegs+'|'+s.players.map(p=>p.setsWon+'.'+p.legsWon).join(',');
    if(key !== lastStandingKey){
      lastStandingKey = key;
      const unit = showSets ? 'sets' : 'legs';
      const val  = p => showSets ? num(p.setsWon) : num(p.legsWon);
      standing.innerHTML = (showLegs || showSets)
        ? s.players.map(p=>`<b>${escapeHtml(p.name)}</b> <span class="chip">${val(p)}</span>`).join(' — ')
          + `<span>${escapeHtml(unit)}</span>`
        : s.players.map(p=>`<b>${escapeHtml(p.name)}</b>`).join(' v ');
    }
    standing.classList.remove('hidden');
  } else {
    standing.classList.add('hidden');
    lastStandingKey = '';
  }

  const n = s.players.length;
  const hasStage = typeof renderer.stage === 'function' && !s.legSummary;
  const hasLane  = typeof renderer.lane  === 'function' && !s.legSummary;
  // A scorecard table is now only for the modes that have not been converted to
  // a lane yet — lane()/stage() win where a mode declares one.
  const isScorecardLayout = !hasStage && !hasLane
    && typeof renderer.scorecard === 'function' && !s.legSummary;

  if(s.legSummary){
    renderResultView(renderer, s, L);
  } else if(hasStage){
    // The mode takes the whole area rather than a row per player — Around the
    // Clock and Around the World, whose board-shaped dial the owner chose over
    // a lane (/frontend-design direction C) because for those two the drill IS
    // a picture of the board.
    grid.className = 'stage';
    grid.style.gridTemplateColumns = '';
    grid.innerHTML = renderer.stage(s, L);
  } else if(hasLane){
    grid.className = 'lanes';
    grid.style.gridTemplateColumns = '';
    // extraLanes() is for a lane that is not a player — the session lane a solo
    // practice board shows where the opponent would be.
    const extra = typeof renderer.extraLanes === 'function' ? renderer.extraLanes(s, L) : '';
    grid.innerHTML = s.players.map((p,i)=>renderer.lane(p, i, s, L)).join('') + extra;
  } else if(isScorecardLayout){
    grid.className = 'grid';
    grid.style.gridTemplateColumns = '1fr';
    grid.innerHTML = renderer.scorecard(s, L);
  } else {
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${isPortrait ? 1 : (n<=1 ? 1 : n<=4 ? 2 : 3)}, 1fr)`;
    grid.innerHTML = s.players.map((p,i)=>renderer.card(p, i, s, L)).join('');
  }

  if(!s.legSummary){ verdict.classList.add('hidden'); tallies.classList.add('hidden'); }
  renderStrip(renderer, s, L);

  // Scorecard/lane/stage layouts render no .score elements at all — skip the
  // query/effects pass entirely instead of running it to find nothing every
  // tick. NOT skipped for a legSummary render (any game type can show one
  // transiently between legs): triggerChalkEffects()'s own truncation of
  // lastScoreTexts to the current (zero) element count is what keeps a later
  // return to per-player cards from comparing against stale leg data.
  if(!isScorecardLayout && !hasStage && !hasLane) triggerChalkEffects();

  // achievement flashes (180, Big Fish, nine-darter)
  if(s.achievement && s.achievement.ts){
    if(s.achievement.ts !== lastAchTs){
      lastAchTs = s.achievement.ts;
      lastAchCountText = s.achievement.countText || '';
      showAchievement(s.achievement.type, s.achievement.player, s.achievement.countText);
    } else if((s.achievement.countText || '') !== lastAchCountText && achOverlay.classList.contains('show')){
      // Same achievement, a later push once the award count resolved — patch
      // the count in place rather than restarting the reveal/confetti.
      lastAchCountText = s.achievement.countText || '';
      if(achCount) achCount.textContent = lastAchCountText;
    }
  }

  handleVoiceEvents(s);

  // Result banners (leg / set / game). SUPPRESSED whenever a result view is on
  // screen: the banner is a full-screen black overlay, and it used to sit on top
  // of the very summary it was announcing for the same 3.5 seconds those numbers
  // were worth reading. The result view says the same thing, larger, without
  // hiding anything — so the banner is now only for the moments that have no
  // result view of their own (a set win, a message with no legSummary behind it).
  if(s.legSummary){
    bannerKey = s.message || '';
    banner.classList.remove('show');
    clearTimeout(bannerTimer);
  } else if(s.message && s.message !== bannerKey){
    bannerKey = s.message;
    document.getElementById('banner-big').textContent = s.done ? (s.doneHeading || 'GAME OVER') : s.message;
    document.getElementById('banner-sub').textContent = s.done ? s.message
      : s.message.includes(' the set') ? 'next set coming up'
      : 'next leg coming up';
    banner.classList.add('show');
    if(!s.done){ clearTimeout(bannerTimer); bannerTimer = setTimeout(()=>banner.classList.remove('show'), 3500); }
  } else if(!s.message && !s.done){
    // A message-less snapshot clears the banner (e.g. play resuming next leg). Guard on
    // !s.done so the persistent GAME OVER banner isn't dismissed by a trailing
    // achievement broadcast (which carries message:'' but keeps done:true) — it stays
    // up until a new game actually starts (done:false).
    bannerKey=''; banner.classList.remove('show');
  }
}

/* docs/bug-roadmap.md BUG-30 — the only entry point anything should call.
 *
 * render() writes to the DOM incrementally (format bar, then the player grid, then
 * banners), so an exception part-way through leaves the earlier writes applied and the
 * later ones not: a TORN frame mixing the new game's header with the previous game's
 * scores. Every call site used to be wrapped in a bare `catch(e){}`, which meant that
 * happened silently — nothing in the console, nothing server-side, and the screen stuck
 * that way for as long as the controller kept pushing whatever shape was throwing.
 *
 * That is reachable without an attacker: `modeState` is forwarded by the server as an
 * opaque object (code-quality item 42, deliberately — it removed the third sync point
 * that caused BUG-28), so the shape of everything inside it is guaranteed only by the
 * frontend producer agreeing with this file. One mode emitting an incomplete card
 * mid-leg used to freeze the TV for the rest of the leg with no way to find out why.
 *
 * So: log it (a silent catch on the only redraw path is the root cause), then repaint
 * the last snapshot that DID render cleanly, so a failure degrades to a consistent
 * stale frame rather than an incoherent one. `restoring` breaks the recursion if that
 * repaint throws too — in which case the screen keeps whatever it has and the console
 * carries both errors.
 */
let restoring = false;
function renderSafe(s){
  try {
    render(s);
    lastGoodSnapshot = s;
  } catch (e) {
    console.error('[display] render failed for this snapshot; keeping the last good frame', e, s);
    if(restoring || !lastGoodSnapshot) return;
    restoring = true;
    try { render(lastGoodSnapshot); }
    catch (e2) { console.error('[display] restoring the last good frame also failed', e2); }
    finally { restoring = false; }
  }
}

function setLive(on){
  dot.classList.toggle('off', !on);
  liveTx.textContent = on ? 'live' : 'reconnecting…';
}

/* ---- connect to the live stream (with polling fallback) ---- */
let usePoll = false, pollTimer = null;
function startPolling(){
  if(usePoll) return; usePoll = true; setLive(false);
  const tick = async () => {
    try { const r = await fetch('/api/live', {cache:'no-store'}); if(r.ok){ setLive(true); renderSafe(await r.json()); } else setLive(false); }
    catch(e){ setLive(false); }
  };
  tick(); pollTimer = setInterval(tick, 1500);
}
function connect(){
  if(typeof EventSource === 'undefined') return startPolling();
  let es;
  try { es = new EventSource('/api/live/stream'); }
  catch(e){ return startPolling(); }
  let errCount = 0;
  es.onopen = () => { setLive(true); errCount = 0; };
  // renderSafe(), not a bare `try { render(...) } catch(e){}` — see BUG-30 above. The
  // try here now only guards JSON.parse of the stream frame itself.
  es.onmessage = (ev) => {
    setLive(true); errCount = 0;
    let snap; try { snap = JSON.parse(ev.data); } catch(e){ console.error('[display] unparseable stream frame', e); return; }
    renderSafe(snap);
  };
  es.onerror = () => {
    setLive(false);
    errCount++;
    // A fatal close (readyState CLOSED) means the browser won't auto-retry — this is
    // what happens when the server rejects the stream with a non-2xx (e.g. the 503
    // connection-cap response). Fall back to polling immediately rather than waiting
    // for 3 retries that will never come. Transient drops keep readyState CONNECTING,
    // so those still get the auto-reconnect + 3-strikes behaviour.
    if(errCount >= 3 || es.readyState === EventSource.CLOSED){ es.close(); startPolling(); }
  };
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// The live snapshot arrives from an unauthenticated POST /api/live, so every field
// is treated as untrusted: strings are HTML-escaped, numeric fields are coerced.
function esc(v){ return escapeHtml(v == null ? '' : String(v)); }
function num(v){ return Number(v) || 0; }

// connect()'s SSE handshake (or, if it falls back, startPolling()'s first tick)
// already delivers the current live state immediately — the backend writes it
// as the very first SSE event on connect (backend/server.js) — so a separate
// initial fetch here would just render the same snapshot twice.
connect();
</script>
</body>
</html>
